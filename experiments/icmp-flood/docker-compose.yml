services:
  target:
    build:
      context: ./target
    mem_limit: 128m
    cpus: 0.50
    networks:
      - lab-network
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  simulator:
    build:
      context: ./simulator
    mem_limit: 128m
    cpus: 0.50
    cap_add:
      - NET_RAW
    profiles:
      - attack
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
    internal: true
